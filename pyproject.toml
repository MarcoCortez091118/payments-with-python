[project]
name = "payments-agent"
version = "0.1.0"
description = "Conversational payments agent built with FastAPI"
authors = [{name = "Payments Team"}]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "tenacity>=8.2",
    "aiobreaker>=1.4",
    "langchain>=0.1",
    "langchain-openai>=0.1",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "orjson>=3.9"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.20",
    "anyio>=4.2"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing"
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "mock_api*"]
